server {
    server_name www.glacier-evolution.nat.fau.de;

    client_max_body_size 50m;

    # Browsers use HTTPS only for this host for one year (not inherited by locations with their own add_header)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Compress Dash JSON payloads (3D frames are ~2 MB uncompressed)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # OpenTopoMap basemap tiles, proxied and cached (see deploy/nginx-tiles.conf). Only tile paths are allowed.
    # OpenTopoMap has tiles up to zoom 17; the map scales up the last level beyond that.
    location ~ ^/tiles/otm/(\d+)/(\d+)/(\d+)\.png$ {
        resolver 131.188.0.10 131.188.0.11 valid=300s;
        proxy_pass https://tile.opentopomap.org/$1/$2/$3.png;
        proxy_ssl_server_name on;
        proxy_set_header Host tile.opentopomap.org;
        # send nothing about the visitor
        proxy_set_header User-Agent "glacier-evolution.nat.fau.de tile proxy";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_set_header Accept-Language "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;   # upstream sends its own; we add exactly one below
        proxy_ignore_headers Set-Cookie;

        proxy_cache tiles;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin "*";   # lets a local dev instance use the proxy
        access_log off;                               # tile requests are not needed in the logs
    }

    # 3D data: terrain tiles and the per-year ice blocks are fixed per URL, so nginx caches them
    # (same cache zone as the map tiles) and repeat requests never reach Python.
    location /api3d/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_cache tiles;
        proxy_cache_valid 200 302 7d;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        access_log off;                               # tile and data requests are not needed in the logs
    }

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.glacier-evolution.nat.fau.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.glacier-evolution.nat.fau.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = www.glacier-evolution.nat.fau.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name www.glacier-evolution.nat.fau.de;
    return 404; # managed by Certbot


}