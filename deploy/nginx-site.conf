server {
    server_name www.glacier-evolution.nat.fau.de;

    server_tokens off;                  # no nginx version in headers and error pages
    client_max_body_size 2m;            # no uploads; Dash callback requests are small

    # Full log with complete IPs (deleted after 14 days) plus the anonymised statistics log (kept one year,
    # format and retention in nginx-logs.conf). Setting access_log here replaces the one inherited from nginx.conf.
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/stats/access-anon.log anon;

    # HTTPS only for one year (HSTS), CSP and the other security headers (deploy/nginx-security-headers.conf)
    include snippets/glacierdash-headers.conf;

    # Compress Dash JSON payloads (3D frames are ~2 MB uncompressed) and the scripts (Flask sends text/javascript)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml;

    # 3D data: terrain tiles and the per-year ice blocks are fixed per URL, so nginx caches them
    # (cache zone from deploy/nginx-tiles.conf) and repeat requests never reach Python.
    location /api3d/ {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        limit_req zone=api3d burst=300 nodelay;      # zone in deploy/nginx-tiles.conf
        limit_req_status 429;

        proxy_cache tiles;
        proxy_cache_valid 200 302 7d;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        include snippets/glacierdash-headers.conf;   # add_header above stops the server's from being inherited
        access_log off;                               # tile and data requests are not needed in the logs
    }

    # Dash callbacks: rate limit per IP (zone in deploy/nginx-tiles.conf)
    location = /_dash-update-component {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        limit_req zone=dash burst=200 nodelay;
        limit_req_status 429;
    }

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }

    listen 443 ssl http2; # managed by Certbot (http2: the many tile and data requests share one connection)
    ssl_certificate /etc/letsencrypt/live/www.glacier-evolution.nat.fau.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.glacier-evolution.nat.fau.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
# The address without www (on the same certificate): to the www address
server {
    listen 443 ssl http2;
    server_name glacier-evolution.nat.fau.de;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/www.glacier-evolution.nat.fau.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.glacier-evolution.nat.fau.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    include snippets/glacierdash-headers.conf;
    return 301 https://www.glacier-evolution.nat.fau.de$request_uri;
}

# HTTP, with or without www: to HTTPS on the www address (certbot renews through its own temporary config)
server {
    listen 80;
    server_name www.glacier-evolution.nat.fau.de glacier-evolution.nat.fau.de;
    server_tokens off;
    return 301 https://www.glacier-evolution.nat.fau.de$request_uri;
}