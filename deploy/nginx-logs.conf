# Anonymised access log for visitor statistics (http context). Installed at /etc/nginx/conf.d/logs.conf.
# The last IPv4 byte (IPv6: everything after the first 48 bits) is zeroed, so country and city can still be
# looked up but a line no longer points to one person. Kept for one year (logrotate-nginx-stats); the full
# access.log with complete IPs stays at nginx's default of 14 days.
map $remote_addr $remote_addr_anon {
    ~^(?P<net>\d+\.\d+\.\d+)\.\d+$                     $net.0;
    ~*^(?P<net>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):         $net::;
    ~*^(?P<net>[0-9a-f]+:[0-9a-f]+)::                  $net::;     # e.g. 2001:db8::1
    ~*^(?P<net>[0-9a-f]+)::                            $net::;
    default                                             0.0.0.0;
}

# Same layout as nginx's "combined" format, so the usual log tools read it
log_format anon '$remote_addr_anon - - [$time_local] "$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent"';
