# Security headers for every response of the site. Installed at /etc/nginx/snippets/glacierdash-headers.conf and
# included in the server block and in every location with its own add_header (nginx does not inherit them there).
# The CSP allows only this site: Dash needs inline scripts and new Function() (clientside callbacks), MapLibre
# runs its workers from blob: URLs and draws images from blob:/data:.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
