# Cache and rate limit for the 3D app's terrain tiles and ice blocks under /api3d/ (http context).
# Installed at /etc/nginx/conf.d/tiles.conf.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m max_size=2g inactive=30d use_temp_path=off;

# Per visitor IP. Generous: a first visit loads ~55 tiles and blocks, playback asks for 4 years a second, and a
# room shares one IP (20 phones on a venue's Wi-Fi scanning a QR code at once: ~1100 requests in a few seconds;
# at 50r/s with burst 300 most of them got 429). Only meant to stop scripts hammering the data API.
limit_req_zone $binary_remote_addr zone=api3d:10m rate=200r/s;

# Dash callbacks (the year slider fires them while dragging, playback 4 a second): also generous, against scripts
limit_req_zone $binary_remote_addr zone=dash:10m rate=60r/s;
