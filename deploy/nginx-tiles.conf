# Cache and rate limit for the 3D app's terrain tiles and ice blocks under /api3d/ (http context).
# Installed at /etc/nginx/conf.d/tiles.conf.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m max_size=2g inactive=30d use_temp_path=off;

# Per visitor IP. Generous: a pan loads dozens of tiles at once, playback asks for 4 years a second, and a
# school class or a whole institute can share one IP. Only meant to stop scripts hammering the data API.
limit_req_zone $binary_remote_addr zone=api3d:10m rate=50r/s;
