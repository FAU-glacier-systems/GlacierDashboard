# Basemap (OpenTopoMap) tile cache (http context). Installed at /etc/nginx/conf.d/tiles.conf.
# Visitors fetch basemap tiles from /tiles/otm/ on our server; only the server talks to OpenTopoMap,
# so visitor IP addresses are never sent to a third party.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m max_size=2g inactive=30d use_temp_path=off;
