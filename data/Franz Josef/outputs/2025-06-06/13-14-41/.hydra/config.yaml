cwd: ${get_cwd:0}
core:
  url_data: ''
  folder_data: data
  logging_file: ''
  logging: false
  logging_level: 30
  hardware:
    gpu_info: true
    visible_gpus:
    - 0
    strategy: none
  print_params: false
  print_comp: false
  print_info: true
  print_imported_modules: true
  check_compat_params: true
  structure:
    root_foldername: user
    conf_foldername: conf
    code_foldername: code
    input_modules_foldername: inputs
    process_modules_foldername: processes
    output_modules_foldername: outputs
inputs:
  oggm_shop:
    RGI_ID: RGI60-18.02397
    RGI_IDs:
    - RGI60-11.01450
    preprocess: true
    dx: 100
    border: 30
    thk_source: consensus_ice_thickness
    vel_source: millan_ice_velocity
    incl_glathida: false
    path_glathida: ''
    filename: input.nc
    remove_RGI_folder: true
    sub_entity_mask: false
    smooth_obs_vel: true
    highres: false
  local:
    type: netcdf
    filename: input.nc
    coarsening:
      boundary: trim
      ratio: 1
    crop:
      xmin: null
      xmax: null
      ymin: null
      ymax: null
    icemask:
      include: false
      shapefile: icemask.shp
      invert: false
outputs: {}
processes: {}
