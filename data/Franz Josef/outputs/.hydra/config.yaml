cwd: ${get_cwd:0}
core:
  url_data: ''
  folder_data: data
  logging_file: ''
  logging: false
  logging_level: 30
  hardware:
    gpu_info: true
    visible_gpus:
    - 0
    strategy: none
  print_params: false
  print_comp: false
  print_info: true
  print_imported_modules: true
  check_compat_params: true
  structure:
    root_foldername: user
    conf_foldername: conf
    code_foldername: code
    input_modules_foldername: inputs
    process_modules_foldername: processes
    output_modules_foldername: outputs
processes:
  smb_simple:
    update_freq: 1.0
    file: param.txt
    array:
    - - time
      - gradabl
      - gradacc
      - ela
      - accmax
    - - 2000
      - 0.008
      - 0.002
      - 2167
      - 5.0
    - - 2100
      - 0.008
      - 0.002
      - 2567
      - 5.0
  iceflow:
    method: emulated
    force_max_velbar: 0.0
    physics:
      gravity_cst: 9.81
      ice_density: 910.0
      init_slidingco: 0.0464
      init_arrhenius: 78.0
      enhancement_factor: 1.0
      exp_glen: 3.0
      exp_weertman: 3.0
      regu_glen: 1.0e-05
      regu_weertman: 1.0e-10
      new_friction_param: true
      dim_arrhenius: 2
      regu: 0.0
      thr_ice_thk: 0.1
      min_sr: 1.0e-20
      max_sr: 1.0e+20
      force_negative_gravitational_energy: false
      cf_eswn: []
      cf_cond: false
    numerics:
      Nz: 10
      vert_spacing: 4.0
    solver:
      step_size: 1.0
      nbitmax: 100
      stop_if_no_decrease: true
      optimizer: Adam
      lbfgs: false
      save_cost: ''
      plot_sol: false
    emulator:
      fieldin:
      - thk
      - usurf
      - arrhenius
      - slidingco
      - dX
      retrain_freq: 10
      lr: 2.0e-05
      lr_init: 0.0001
      lr_decay: 0.95
      warm_up_it: -10000000000.0
      nbit_init: 1
      nbit: 1
      framesizemax: 750
      split_patch_method: sequential
      pretrained: true
      name: ''
      save_model: false
      exclude_borders: 0
      optimizer: Adam
      optimizer_clipnorm: 1.0
      optimizer_epsilon: 1.0e-07
      save_cost: ''
      output_directory: ''
      plot_sol: false
      pertubate: false
      network:
        architecture: cnn
        multiple_window_size: 0
        activation: LeakyReLU
        nb_layers: 16
        nb_blocks: 4
        nb_out_filter: 32
        conv_ker_size: 3
        dropout_rate: 0
        weight_initialization: glorot_uniform
        cnn3d_for_vertical: false
  time:
    start: 2000
    end: 2100
    save: 10.0
    cfl: 0.3
    step_max: 1.0
  thk:
    slope_type: superbee
    ratio_density: 0.91
    default_sealevel: 0.0
inputs:
  load_ncdf:
    input_file: input.nc
    method_coarsen: skipping
    coarsen: 1
    crop: false
    xmin: -1.0e+20
    xmax: 1.0e+20
    ymin: -1.0e+20
    ymax: 1.0e+20
    icemask_include: false
    icemask_shapefile: icemask.shp
    icemask_invert: false
outputs:
  write_ncdf:
    output_file: output_4.nc
    vars_to_save:
    - topg
    - usurf
    - thk
    - smb
    - velbar_mag
    - velsurf_mag
    - uvelsurf
    - vvelsurf
    - wvelsurf
